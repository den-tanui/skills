[project]
name = "skill-manager"
version = "0.1.0"
description = "Semantic skill management for OpenCode"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "tree-sitter>=0.23",
    "tree_sitter_languages>=1.10",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "numpy>=1.24",
]

[project.scripts]
skill-manager = "skill_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "acceptance: tests that use the real embedding model",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"